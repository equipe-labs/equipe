<!doctype html><html lang="en"><meta charset="utf-8"><title>Reference board</title>
<style>
:root{--bg:#F4F3EF;--card:#FFFFFF;--ink:#16171A;--muted:#5C5E66;--line:#DAD8D2;--chip:#E9E7E1}
*{box-sizing:border-box}body{margin:0;padding:40px;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:24px;margin:0 0 4px}.summary,.brief{color:var(--muted);margin:0 0 4px}.rule{color:var(--muted);font-size:12px;margin:0 0 24px}
main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.shot{aspect-ratio:16/10;overflow:hidden;background:var(--chip);border-bottom:1px solid var(--line)}.shot img{width:100%;display:block}
figcaption{padding:12px 14px}figcaption p{margin:0 0 6px}.meta{color:var(--muted)}.meta b{color:var(--ink)}
.chip{display:inline-block;background:var(--chip);border-radius:4px;padding:1px 8px;margin-right:4px;font-size:12px}
.learn{font-size:15px}.url{color:var(--muted);font-size:11px;word-break:break-all}
</style>
<h1>Reference board</h1><p class="summary">References: 2 · Sources: 2</p><p class="brief">The same document surface takes the whole content area and returns exactly to where it came from</p><p class="rule">Learn the patterns and layouts; never take another company's logo, name, marks or words.</p><main><figure><div class="shot"><img src="R1/1200.png" alt=""></div><figcaption><p class="meta"><b>R1</b> · linear.app · 2026-11-09</p><p class="chips"><span class="chip">pattern</span></p><p class="learn">Peek opens and closes details quickly while keeping the current context</p><p class="url">https://linear.app/changelog/2019-09-23-improved-peek</p></figcaption></figure><figure><div class="shot"><img src="R2/1200.png" alt=""></div><figcaption><p class="meta"><b>R2</b> · manual.raycast.com · 2026-11-09</p><p class="chips"><span class="chip">pattern</span></p><p class="learn">A consistent rule: Esc steps back to the previous view from the innermost state outward</p><p class="url">https://manual.raycast.com/keyboard-shortcuts</p></figcaption></figure></main></html>
