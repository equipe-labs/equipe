<style>
:root{--bg:#F4F3EF;--card:#FFFFFF;--ink:#16171A;--muted:#5C5E66;--line:#DAD8D2;--chip:#E9E7E1}

<h1>레퍼런스 보드</h1><p class="summary">레퍼런스: 2 · 출처: 2</p><p class="brief">같은 문서 surface가 앱 전체 콘텐츠를 쓰고, 원래 맥락으로 정확히 돌아간다</p><p class="rule">패턴과 레이아웃을 배웁니다. 다른 회사의 로고, 이름, 브랜드 마크, 문구는 절대 가져오지 않습니다.</p><main><figure><div class="shot"><img src="R1/1200.png" alt=""></div><figcaption><p class="meta"><b>R1</b> · linear.app · 2026-11-09</p><p class="chips"><span class="chip">패턴</span></p><p class="learn">Peek에서 현재 맥락을 유지한 채 상세를 빠르게 여닫는 구조</p><p class="url">https://linear.app/changelog/2019-09-23-improved-peek</p></figcaption></figure><figure><div class="shot"><img src="R2/1200.png" alt=""></div><figcaption><p class="meta"><b>R2</b> · manual.raycast.com · 2026-11-09</p><p class="chips"><span class="chip">패턴</span></p><p class="learn">Esc를 가장 안쪽 상태부터 이전 보기로 되돌리는 일관된 규칙</p><p class="url">https://manual.raycast.com/keyboard-shortcuts</p></figcaption></figure></main></html>
