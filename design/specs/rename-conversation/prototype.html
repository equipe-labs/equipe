const Q = new URLSearchParams(location.search);
const state = Q.get('state') || 'editing', lang = Q.get('lang') || 'ko', mode = Q.get('mode') || 'light';

// Copy: existing keys where the app has them (sidebar.outside, header.context, header.move_to,

const C = {

        auto: '가격 페이지 문구 다듬기', next: '11월 가격 페이지 카피', typing: '11월 가격 페이지 카', marked: '피',
        pasted: '11월 가격 페이지 카피 — 첫 화면 헤드라인과 요금표 설명, 자주 묻는 질문까지 정리' },
  en: { outside: 'Outside projects', ctx: 'context 31%', move: 'Move to another project', away: 'Put away', rename: 'Rename', label: 'Conversation name', save: 'Save', cancel: 'Cancel', retry: 'Try again',
        empty: 'Enter a name.', long: (m, o) => `Up to ${m} characters. Remove ${o}.`, failed: 'Couldn’t save the name. What you typed is kept.', offline: 'Lost the connection to your Mac, so the name wasn’t saved. What you typed is kept.',

        auto: '润色定价页面文案', next: '11 月定价页文案', typing: '11 月定价页文案', marked: '', pasted: '11 月定价页文案 — 首屏标题、价格表说明和常见问题一次整理完毕，并补充下一步要做的事和负责人' },
  'zh-Hant': { outside: '專案之外', ctx: '上下文 31%', move: '移到其他專案', away: '收起對話', rename: '重新命名', label: '對話名稱', save: '儲存', cancel: '取消', retry: '重試',
        empty: '請輸入名稱。', long: (m, o) => `最多 ${m} 個字元，請刪去 ${o} 個。`, failed: '未能儲存名稱，已保留你輸入的內容。', offline: '與 Mac 的連線已中斷，未能儲存名稱。已保留你輸入的內容。',
        auto: '潤飾定價頁面文案', next: '11 月定價頁文案', typing: '11 月定價頁文案', marked: '', pasted: '11 月定價頁文案 — 首屏標題、價格表說明和常見問題一次整理完畢，並補充下一步要做的事和負責人' },
  fr: { outside: 'Hors projets', ctx: 'contexte 31 %', move: 'Déplacer vers un autre projet', away: 'Ranger', rename: 'Renommer', label: 'Nom de la conversation', save: 'Enregistrer', cancel: 'Annuler', retry: 'Réessayer',
        empty: 'Saisissez un nom.', long: (m, o) => `${m} caractères au maximum. Retirez-en ${o}.`, failed: 'Nom non enregistré. Votre saisie est conservée.', offline: 'Connexion au Mac perdue : nom non enregistré. Votre saisie est conservée.',
        auto: 'Textes de la page tarifs', next: 'Textes tarifs de novembre', typing: 'Textes tarifs de novembre', marked: '', pasted: 'Textes tarifs de novembre — titre, grille et FAQ' },
  es: { outside: 'Fuera de proyectos', ctx: 'contexto 31%', move: 'Mover a otro proyecto', away: 'Guardar', rename: 'Cambiar nombre', label: 'Nombre de la conversación', save: 'Guardar', cancel: 'Cancelar', retry: 'Reintentar',
        empty: 'Escribe un nombre.', long: (m, o) => `Máximo ${m} caracteres. Quita ${o}.`, failed: 'No se guardó el nombre. Lo que escribiste se conserva.', offline: 'Se perdió la conexión con el Mac y no se guardó el nombre. Lo que escribiste se conserva.',
        auto: 'Textos de la página de precios', next: 'Textos de precios de noviembre', typing: 'Textos de precios de noviembre', marked: '', pasted: 'Textos de precios de noviembre — titular, tabla y FAQ' },
};
const L = C[lang] || C.en;
const MAX = 40;
const chars = s => [...new Intl.Segmenter(lang, { granularity: 'grapheme' }).segment(s)].length;

const ICON = {
  pencil: '<path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/>',
  ellipsis: '<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  folder: '<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
  alert: '<circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>',
  term: '<path d="m7 11 2-2-2-2"/><path d="M11 13h4"/><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>',
  globe: '<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>',
};
const svg = (n, s, c = 'currentColor', w = 2) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');

// What each state shows. title: header and sidebar; card: the rename card or none.
const S = {
  'entry-title':   { title: L.auto, titleCls: 'hover', tip: 'title', cursorAt: 'title' },
  'entry-menu':    { title: L.auto, titleCls: '', menu: true },
  'entry-sidebar': { title: L.auto, sideHover: true, tip: 'side', cursorAt: 'pen' },
  'editing':       { title: L.auto, titleCls: 'active', card: { value: L.auto, sel: true } },
  'composing':     { title: L.auto, titleCls: 'active', card: { value: L.typing, marked: L.marked } },
  'empty':         { title: L.auto, titleCls: 'active', card: { value: '', msg: 'empty' } },
  'too-long':      { title: L.auto, titleCls: 'active', card: { value: L.pasted, msg: 'long' } },
  'saved':         { title: L.next, titleCls: 'focus' },
  'failed':        { title: L.auto, titleCls: 'active', card: { value: L.next, msg: 'offline' } },
  'long':          { title: L.auto, sideHover: true, tip: 'side-full' },
  'large':         { title: L.auto, titleCls: 'active', card: { value: L.next, caretEnd: true } },
  'large-failed':  { title: L.auto, titleCls: 'active', card: { value: L.next, msg: 'offline' } },
}[state];

// The window is drawn at its own size (the shot's, in points); any other viewport
// (a lint at phone or wide widths) sees the whole window scaled to fit, one system.
const vw = Math.round(W / Z), vh = Math.round(760 / Z);
const fit = Math.min(window.innerWidth / vw, window.innerHeight / vh);
const app = document.getElementById('app');
app.style.width = vw + 'px'; app.style.height = vh + 'px';
const baseName = { ko: 'ko', en: 'en', de: 'de' }[lang] || 'en';
const kind = W === 1200 ? (Z > 1 ? 'large' : 'base') : (Z > 1 ? 'talllarge' : 'tall');
document.getElementById('base').src = `base/${kind}-${baseName}.${mode}.${W}.png`;

// Narrow bar (760 at 150%): the context figure gives way first, then the place, then the title.
const narrow = vw - 260 < 360;
const hdr = document.createElement('div');
hdr.className = 'hdr';
hdr.innerHTML = `
  <div class="crumb">
    <span class="place" title="${esc(L.outside)}">${esc(L.outside)}</span><span class="slash">/</span>
    <span class="title ${S.titleCls || ''}" id="title" role="button" aria-label="${esc(S.title)}" aria-description="${esc(L.rename)}"><span class="t">${esc(S.title)}</span>${svg('pencil', 12)}</span>
    <span class="ib ${S.menu ? 'on' : ''}" id="more" aria-label="this conversation">${svg('ellipsis', 15)}</span>
  </div>
  <div class="gapx"></div>
  ${narrow ? '' : `<span class="ctx">${esc(L.ctx)}</span>`}
  <span class="ib">${svg('term', 16)}</span><span class="ib">${svg('globe', 16)}</span>`;
hdr.querySelector('.title svg').classList.add('pen');
app.appendChild(hdr);
// The title has the bar first: while it is cut, the context figure goes, then
// the place folds to its mark (its name on the pointer), and where even that
// doesn't fit (760 at 150%) the place and its slash go. The ⋯ always stays.
{
  const t = hdr.querySelector('.title .t'), cut = () => t.scrollWidth > t.clientWidth + 1;
  const ctx = hdr.querySelector('.ctx'), place = hdr.querySelector('.place');
  if (cut() && ctx) ctx.remove();
  if (cut() && place && S.card && narrow) { place.remove(); hdr.querySelector('.slash').remove(); }
  if (cut() && hdr.contains(place)) { place.innerHTML = '<span class="ring7"></span>'; place.classList.add('folded'); }
  const over = () => hdr.scrollWidth > hdr.clientWidth + 1;
  if (over() && hdr.contains(place)) { place.remove(); hdr.querySelector('.slash').remove(); }
}

// The sidebar row, where the shot shows it (100% only; at 150% it sits below the fold).
let srow = null;
if (Z === 1) {
  srow = document.createElement('div');
  srow.className = 'srow on';
  srow.setAttribute('aria-label', S.title);
  srow.innerHTML = `<span class="ind"></span><span class="t">${esc(S.title)}</span>` + (S.sideHover ? `<span class="act ${S.tip === 'side' ? 'hover' : ''}" id="spen">${svg('pencil', 12)}</span><span class="act">${svg('x', 12)}</span>` : '');
  app.appendChild(srow);
}

const rect = el => { const r = el.getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height, r: r.right, b: r.bottom }; };
const title = document.getElementById('title');

function tip(html, anchor) {
  const t = document.createElement('div');
  t.className = 'tip'; t.innerHTML = html; app.appendChild(t);
  const a = rect(anchor), tr = rect(t);
  t.style.left = Math.max(8, Math.min(a.x + a.w / 2 - tr.w / 2, vw - tr.w - 8)) + 'px';
  t.style.top = (a.b + 6) + 'px';
}
const truncated = el => { const t = el.querySelector('.t'); return t.scrollWidth > t.clientWidth + 1; };
if (S.tip === 'title') tip((truncated(title) ? `${esc(S.title)}<br><span class="sub">${esc(L.rename)}</span>` : esc(L.rename)), title);
if (S.tip === 'side' && srow) tip(esc(L.rename), document.getElementById('spen'));
if (S.tip === 'side-full' && srow) tip(truncated(srow) ? esc(S.title) : esc(L.rename), srow.querySelector('.t'));

if (S.menu) {
  const m = document.createElement('div');
  m.className = 'pop menu'; m.setAttribute('role', 'menu');
  const item = (icon, label, cls = '', tail = '') => `<div class="it ${cls}" role="menuitem"><span class="m">${icon}</span><span class="l">${esc(label)}</span>${tail}</div>`;
  m.innerHTML = item(svg('pencil', 12), L.rename, 'hover focus') + '<div class="sep"></div>' +
    `<div class="head">${esc(L.move)}</div>` +
    ['web', 'app', 'api'].map(n => item(svg('folder', 12), n)).join('') +
    item('<span class="ring7"></span>', L.outside, 'on', svg('check', 13)) +
    '<div class="sep"></div>' + item(svg('x', 12), L.away);
  app.appendChild(m);
  const a = rect(document.getElementById('more'));
  m.style.left = Math.max(8, Math.min(a.x, vw - 240 - 8)) + 'px'; m.style.top = (a.y + 32) + 'px';
}

if (S.card) {
  const c = S.card, v = c.value + (c.marked || '');
  const n = chars(v), over = n - MAX;
  const failed = c.msg === 'failed' || c.msg === 'offline';
  const slim = Math.min(360, vw - Math.max(268, document.getElementById('title').getBoundingClientRect().left) - 8) < 300;
  const count = n >= 30 && !failed ? `<span class="count ${over > 0 ? 'err' : ''}">${n}/${MAX}</span>` : '';
  const card = document.createElement('div');
  card.className = 'pop card'; card.setAttribute('role', 'dialog'); card.setAttribute('aria-label', L.rename);
  let val;
  if (!v) val = '<span class="caret"></span>';
  else if (c.sel) val = `<span class="scroll selected">${esc(c.value)}</span>`;
  else if (over > 0) { const g = [...new Intl.Segmenter(lang, { granularity: 'grapheme' }).segment(c.value)].map(x => x.segment); val = `<span class="scroll">${esc(g.slice(0, MAX).join(''))}</span><span class="scroll over">${esc(g.slice(MAX).join(''))}</span><span class="caret"></span>`; }
  else val = `<span class="scroll">${esc(c.value)}</span>${c.marked ? `<span class="scroll marked">${esc(c.marked)}</span>` : ''}<span class="caret"></span>`;
  const msg = c.msg === 'empty' ? `<span class="msg err">${svg('alert', 13)}<span>${esc(L.empty)}</span></span>`
            : c.msg === 'long' ? `<span class="msg err">${svg('alert', 13)}<span>${esc(L.long(MAX, over))}</span></span>`
            : c.msg === 'failed' ? `<span class="msg err" role="alert">${svg('alert', 13)}<span>${esc(L.failed)}</span></span>`
            : c.msg === 'offline' ? `<span class="msg err" role="alert">${svg('alert', 13)}<span>${esc(L.offline)}</span></span>`
            : '';
  const canSave = !(c.msg === 'empty' || c.msg === 'long');
  card.innerHTML = `
    <label class="lbl">${esc(L.label)}</label>
    <div class="field ${c.msg === 'empty' || c.msg === 'long' ? 'err' : 'focus'}"><span class="v" id="v">${val}</span>${slim || over > 0 ? '' : count}</div>
    ${msg || ((slim || over > 0) && count) ? `<div class="meta">${msg || '<span class="msg"></span>'}${slim || over > 0 ? count : ''}</div>` : ''}
    <div class="btns"><span class="btn sec">${esc(L.cancel)}${slim ? '' : ' <span class="k">Esc</span>'}</span><span class="btn pri ${canSave ? '' : 'off'}" data-primary>${esc(failed ? L.retry : L.save)}${slim ? '' : ' <span class="k">↩</span>'}</span></div>`;
  app.appendChild(card);
  // Under the title, its left edge on the title's; kept 8 inside the window.
  const a = rect(title);
  const left = Math.max(260 + 8, Math.min(a.x, vw - 240 - 8)), width = Math.min(360, vw - left - 8);
  card.style.width = width + 'px';
  card.style.left = left + 'px';
  card.style.top = (a.b + 6) + 'px';
  const bt = card.querySelector('.btns');
  if (bt.getBoundingClientRect().height > 40) bt.classList.add('stack');
  // A long value scrolls to its end, as a field does while typing.
  const vv = document.getElementById('v');
  if (!c.sel) vv.scrollLeft = vv.scrollWidth;
  if (!c.sel && vv.scrollWidth > vv.clientWidth) { vv.style.justifyContent = 'flex-end'; vv.classList.add('scrolled'); }
}

if (Math.abs(fit - 1) > 0.01) { app.style.transformOrigin = '0 0'; app.style.transform = `scale(${fit})`; }
document.body.dataset.ready = '1';
</script>
</body>
</html>
