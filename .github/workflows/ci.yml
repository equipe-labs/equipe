name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Smaller, quicker builds: no incremental caches (each run starts clean
  # anyway) and line tables only, which keep a failing test's backtrace readable.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The desktop app pulls in GPUI and its platform toolchain; the CLI is
      # what ships, so CI covers everything else.
      - run: cargo test --workspace --exclude equipe-desktop --locked
      - run: cargo clippy --workspace --exclude equipe-desktop --all-targets --locked -- -D warnings

  relay:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit

  install-script:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck -s sh install.sh paste-setup.sh
      # Every action pinned to a full commit SHA: a tag can be moved under us.
      - name: Actions are pinned
        run: |
          if grep -rnE '^\s*-?\s*uses:\s' .github/workflows | grep -vE 'uses:\s+(\./|[^@[:space:]]+@[0-9a-f]{40}(\s|$))'; then
            echo "::error::Pin these actions to a full commit SHA (with the version in a comment)"
            exit 1
          fi

  # The release's builds, on main, so their caches live where tag runs can
  # read them: what a tag run saves stays with that tag and no later release
  # finds it. Same toolchain, targets, commands and shared keys as release.yml.
  warm-release:
    name: warm release cache (${{ matrix.target }})
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
            package: equipe
            key: release-aarch64-apple-darwin
          - target: x86_64-apple-darwin
            os: macos-15
            package: equipe
            key: release-x86_64-apple-darwin
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            package: equipe
            key: release-x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            package: equipe
            key: release-aarch64-unknown-linux-musl
          - target: aarch64-apple-darwin
            os: macos-15
            package: equipe-desktop
            key: release-desktop-aarch64
          - target: x86_64-apple-darwin
            os: macos-15
            package: equipe-desktop
            key: release-desktop-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: musl toolchain
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ matrix.key }}
          cache-workspace-crates: ${{ matrix.package == 'equipe-desktop' }}
      # As release.yml builds each: the app with its macOS floor, the CLI without.
      - name: Build
        if: matrix.package == 'equipe'
        run: cargo build --release --locked -p equipe --target ${{ matrix.target }}
      - name: Build the app
        if: matrix.package == 'equipe-desktop'
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
          # The app in 16 pieces: twice as fast to build, 7% larger.
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo build --release --locked -p equipe-desktop --target ${{ matrix.target }}
