name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Smaller, quicker builds: no incremental caches (each run starts clean
  # anyway) and line tables only, which keep a failing test's backtrace readable.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

permissions:
  contents: read

jobs:
  windows:
    name: Windows engines + tools
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install real Windows engine CLIs
        run: npm install --global @anthropic-ai/claude-code @openai/codex
      - name: Detect fake launchers and the real CLIs
        env:
          EQUIPE_TEST_REAL_WINDOWS_CLIS: "1"
        run: cargo test -p equipe-providers --locked
      - name: TP-5 fake engine ticket and accept_work
        run: cargo test -p equipe-core --test accept the_pm_accepts_its_teams_work_itself_unless_the_person_keeps_that_for_themselves --locked
      - run: cargo test -p equipe-desktop-control --locked
      - run: cargo check -p equipe-core -p equipe-providers -p equipe-protocol -p equipe-desktop-control --locked
      - run: cargo build -p equipe-core -p equipe-providers -p equipe-protocol -p equipe-desktop-control --locked
      - run: cargo clippy -p equipe-core -p equipe-providers -p equipe-protocol -p equipe-desktop-control --locked -- -D warnings

  windows-desktop:
    name: Windows desktop (TP-8..TP-10)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build -p equipe-desktop --features snapshot --bins --example fake_daemon --example remote_probe --locked
      - name: TP-9 ConPTY runs a command and its output shows
        run: cargo test -p equipe-desktop --features snapshot --locked conpty_starts_powershell
      - name: "Desktop unit tests (10 Mac/path-assumption tests still fail on Windows, tracked separately)"
        continue-on-error: true
        run: cargo test -p equipe-desktop --features snapshot --locked
      - name: TP-8 screens against the fake daemon
        run: pwsh scripts/windows-desktop-shots.ps1 windows-shots
      - name: TP-10 the desktop reaches a daemon over OpenSSH on loopback
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Service sshd -ErrorAction SilentlyContinue)) { Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0 | Out-Null }
          $bash = 'C:\Program Files\Git\bin\bash.exe'
          New-ItemProperty -Path HKLM:\SOFTWARE\OpenSSH -Name DefaultShell -Value $bash -PropertyType String -Force | Out-Null
          $key = Join-Path $env:RUNNER_TEMP 'probe_key'
          ssh-keygen -q -t ed25519 -N '""' -f $key
          $auth = 'C:\ProgramData\ssh\administrators_authorized_keys'
          Get-Content "$key.pub" | Set-Content $auth -Encoding ascii
          icacls $auth /inheritance:r /grant 'Administrators:F' /grant 'SYSTEM:F' | Out-Null
          Start-Service sshd
          # A stand-in `equipe` on the remote side: the three lines a bridge says, then the pipe stays open.
          $probe = (Resolve-Path 'target\debug\examples\remote_probe.exe').Path -replace '\\', '/'
          $shim = Join-Path $env:USERPROFILE '.cargo\bin\equipe'
          "#!/bin/bash`n`"$probe`" --print-bridge-fixture`ncat`n" | Set-Content $shim -Encoding ascii -NoNewline
          $env:EQUIPE_SSH_OPTIONS = "-i $key -o StrictHostKeyChecking=no -o UserKnownHostsFile=NUL"
          $out = & 'target\debug\examples\remote_probe.exe' "$env:USERNAME@localhost" --seconds 20 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'attached: daemon fixture') { throw 'the desktop did not attach over ssh' }
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: windows-desktop-shots
          path: windows-shots

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The desktop app pulls in GPUI and its platform toolchain; the CLI is
      # what ships, so CI covers everything else.
      - run: cargo test --workspace --exclude equipe-desktop --locked
      - run: cargo clippy --workspace --exclude equipe-desktop --all-targets --locked -- -D warnings

  relay:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit

  install-script:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: shellcheck -s sh install.sh paste-setup.sh
      # Every action pinned to a full commit SHA: a tag can be moved under us.
      - name: Actions are pinned
        run: |
          if grep -rnE '^\s*-?\s*uses:\s' .github/workflows | grep -vE 'uses:\s+(\./|[^@[:space:]]+@[0-9a-f]{40}(\s|$))'; then
            echo "::error::Pin these actions to a full commit SHA (with the version in a comment)"
            exit 1
          fi

  # The release's builds, on main, so their caches live where tag runs can
  # read them: what a tag run saves stays with that tag and no later release
  # finds it. Same toolchain, targets, commands and shared keys as release.yml.
  warm-release:
    name: warm release cache (${{ matrix.target }})
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
            package: equipe
            key: release-aarch64-apple-darwin
          - target: x86_64-apple-darwin
            os: macos-15
            package: equipe
            key: release-x86_64-apple-darwin
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            package: equipe
            key: release-x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            package: equipe
            key: release-aarch64-unknown-linux-musl
          - target: aarch64-apple-darwin
            os: macos-15
            package: equipe-desktop
            key: release-desktop-aarch64
          - target: x86_64-apple-darwin
            os: macos-15
            package: equipe-desktop
            key: release-desktop-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: musl toolchain
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ matrix.key }}
          cache-workspace-crates: ${{ matrix.package == 'equipe-desktop' }}
      # As release.yml builds each: the app with its macOS floor, the CLI without.
      - name: Build
        if: matrix.package == 'equipe'
        run: cargo build --release --locked -p equipe --target ${{ matrix.target }}
      - name: Build the app
        if: matrix.package == 'equipe-desktop'
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
          # The app in 16 pieces: twice as fast to build, 7% larger.
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo build --release --locked -p equipe-desktop --target ${{ matrix.target }}
