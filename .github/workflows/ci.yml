name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Smaller builds: no incremental caches (each run starts clean anyway) and
  # line tables only, which keep a failing test's backtrace readable.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Linux runners have about 14 GB free: a debug build of the workspace with
      # its tests filled it, and the runner died mid-test ("received a shutdown
      # signal"). Room first: toolchains this job never uses.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: Swatinem/rust-cache@v2
      # The desktop app pulls in GPUI and its platform toolchain; the CLI is
      # what ships, so CI covers everything else.
      - run: cargo test --workspace --exclude equipe-desktop --locked
      - run: cargo clippy --workspace --exclude equipe-desktop --all-targets --locked -- -D warnings
      - name: Disk left
        if: always()
        run: df -h .

  relay:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit

  install-script:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck -s sh install.sh paste-setup.sh

  # The release's builds, on main, so their caches live where tag runs can
  # read them: what a tag run saves stays with that tag and no later release
  # finds it. Same toolchain, targets, commands and shared keys as release.yml.
  warm-release:
    name: warm release cache (${{ matrix.target }})
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            package: equipe
            key: release-aarch64-apple-darwin
          - target: x86_64-apple-darwin
            os: macos-14
            package: equipe
            key: release-x86_64-apple-darwin
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            package: equipe
            key: release-x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            package: equipe
            key: release-aarch64-unknown-linux-musl
          - target: aarch64-apple-darwin
            os: macos-14
            package: equipe-desktop
            key: release-desktop-aarch64
          - target: x86_64-apple-darwin
            os: macos-14
            package: equipe-desktop
            key: release-desktop-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl toolchain
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.key }}
          cache-workspace-crates: ${{ matrix.package == 'equipe-desktop' }}
      # As release.yml builds each: the app with its macOS floor, the CLI without.
      - name: Build
        if: matrix.package == 'equipe'
        run: cargo build --release --locked -p equipe --target ${{ matrix.target }}
      - name: Build the app
        if: matrix.package == 'equipe-desktop'
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
          # The app in 16 pieces: twice as fast to build, 7% larger.
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo build --release --locked -p equipe-desktop --target ${{ matrix.target }}
