name: Release

# Push a tag like v0.1.0 (matching the workspace version) to build equipe for
# macOS and Linux and publish a GitHub Release with the binaries, their
# checksums and install.sh, and the desktop app (equipe.dmg, with the appcast
# its updates come from). Run it by hand to build without publishing.
#
# Fast release: when the tagged commit's message contains `[fast]`, only the
# command line is built and published. The desktop app, its notarization and
# the clean-machine install check are skipped, and the release carries the
# previous release's equipe.dmg and appcast.xml unchanged, so the app keeps
# its current version and downloads keep working. See docs/RELEASING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read only by default: only publish writes (the release), and prune-caches
# deletes caches. Secrets and write tokens stay with the jobs that use them.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The commit a build is of, which the app tells the daemon (its screen's look).
  EQUIPE_COMMIT: ${{ github.sha }}

# A newer tag's build cancels an older one still building, so the newest
# version reaches people sooner. Only the building jobs take part: a run
# already publishing finishes, and an older run whose build was cancelled
# skips its publish (it needs the build).
jobs:
  # Normal or fast (see the top of this file).
  mode:
    runs-on: ubuntu-24.04
    outputs:
      fast: ${{ steps.mode.outputs.fast }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: mode
        run: |
          if git log -1 --format=%B | grep -qF '[fast]'; then
            echo "fast=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Fast release: command line only; the desktop app stays at the previous release"
          else
            echo "fast=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build (${{ matrix.target }})
    concurrency:
      group: release-build-${{ github.ref }}-${{ matrix.target }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match the workspace version ${version}"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: musl toolchain
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # Tag runs can read main's caches but what they save stays with the tag,
      # where no later release finds it: main's CI keeps these warm instead
      # (ci.yml, warm-release), under the same shared key.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-${{ matrix.target }}
          save-if: false

      - name: Build
        run: cargo build --release --locked -p equipe --target ${{ matrix.target }}

      # The command line signed with the Developer ID (Hardened Runtime),
      # when the secrets are there — the same identity the app's copy carries
      # (scripts/desktop-dmg.sh). Ad hoc, macOS knows a build only by its hash:
      # every update lost the person's "Always Allow" for its Keychain item,
      # its Local Network and App Management answers, and showed its login
      # item as new. Signed, the requirement is "identifier equipe" and the
      # team, the same for every release (docs/RELEASING.md).
      - name: Sign (macOS)
        if: contains(matrix.target, 'apple-darwin')
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          TARGET: ${{ matrix.target }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "::warning::No Developer ID certificate: the command line stays ad hoc, and macOS asks people again after each update"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          # Signing must never block a release: on any failure below, the
          # command line ships ad hoc as before, with a warning.
          unsigned() { echo "::warning::Couldn't sign the command line ($1): it ships ad hoc this time"; security delete-keychain "$keychain" 2>/dev/null || true; exit 0; }
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null || unsigned "no signing key in the certificate"
          # shellcheck disable=SC2046 # one keychain path per word
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          [ -n "$identity" ] || unsigned "no Developer ID Application identity"
          bin="target/$TARGET/release/equipe"
          codesign --force --timestamp --options runtime --keychain "$keychain" --sign "$identity" --identifier equipe "$bin" || unsigned "codesign failed"
          codesign --verify --strict --verbose=2 "$bin" || unsigned "the signature didn't verify"
          codesign -d -r- "$bin"
          security delete-keychain "$keychain"

      - name: Smoke test
        run: target/${{ matrix.target }}/release/equipe --version

      - name: Package
        shell: bash
        run: |
          name="equipe-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/equipe" LICENSE README.md "dist/$name/"
          cd dist
          tar -czf "$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null; then sha256sum "$name.tar.gz"; else shasum -a 256 "$name.tar.gz"; fi > "$name.tar.gz.sha256"
          rm -rf "$name"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: equipe-${{ matrix.target }}
          path: dist/*

  # The desktop app: scripts/desktop-dmg.sh, signed and notarized when the
  # secrets are there (docs/DESKTOP.md "Shipping the app"), else ad hoc.
  # The app's binary for each chip, on two machines at once: one after the
  # other they made the release wait about fifteen minutes.
  desktop-bin:
    name: desktop (${{ matrix.arch }})
    needs: mode
    if: needs.mode.outputs.fast != 'true'
    concurrency:
      group: release-desktop-bin-${{ matrix.arch }}
      cancel-in-progress: true
    runs-on: macos-15
    strategy:
      matrix:
        arch: [aarch64, x86_64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.arch }}-apple-darwin

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-desktop-${{ matrix.arch }}
          # The vendored GPUI is a path crate: kept too, or it builds from scratch.
          cache-workspace-crates: true
          save-if: false

      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
          # The app in 16 pieces: twice as fast to build, 7% larger.
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        # The `equipe` the app carries — its daemon and command line — is the
        # build job's (the one people install), in one piece: built here in
        # 16 it was 3.8 MB larger a chip, and twice.
        run: cargo build --release --locked -p equipe-desktop --target ${{ matrix.arch }}-apple-darwin

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: equipe-desktop-${{ matrix.arch }}
          path: target/${{ matrix.arch }}-apple-darwin/release/equipe-desktop

  desktop:
    name: desktop (equipe.dmg)
    concurrency:
      group: release-desktop-dmg
      cancel-in-progress: true
    needs: [desktop-bin, build]
    runs-on: macos-15
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match the workspace version ${version}"
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: equipe-desktop-*
          path: prebuilt

      # The CLI for each chip, as the build job packed it.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: equipe-*-apple-darwin
          path: prebuilt-cli

      - name: Unpack the CLI
        run: |
          for arch in aarch64 x86_64; do
            tar -xzf "prebuilt-cli/equipe-$arch-apple-darwin/equipe-$arch-apple-darwin.tar.gz" -C prebuilt-cli
          done

      - name: Developer ID certificate
        if: env.MACOS_CERTIFICATE != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          # shellcheck disable=SC2046 # one keychain path per word
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      - name: Notary key
        if: env.APPLE_API_KEY != ''
        run: |
          echo "$APPLE_API_KEY" > "$RUNNER_TEMP/notary.p8"
          {
            echo "EQUIPE_NOTARY_KEY=$RUNNER_TEMP/notary.p8"
            echo "EQUIPE_NOTARY_KEY_ID=$APPLE_API_KEY_ID"
            echo "EQUIPE_NOTARY_ISSUER=$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"

      - name: Build equipe.dmg
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          EQUIPE_DMG_PREBUILT: prebuilt/equipe-desktop-aarch64/equipe-desktop prebuilt/equipe-desktop-x86_64/equipe-desktop
          EQUIPE_DMG_PREBUILT_CLI: prebuilt-cli/equipe-aarch64-apple-darwin/equipe prebuilt-cli/equipe-x86_64-apple-darwin/equipe
        run: |
          chmod +x prebuilt/*/equipe-desktop prebuilt-cli/*/equipe
          scripts/desktop-dmg.sh

      - name: Check the DMG
        run: |
          hdiutil verify dist/equipe.dmg
          mount="$(hdiutil attach -nobrowse -readonly dist/equipe.dmg | tail -1 | cut -f3)"
          lipo -archs "$mount/equipe.app/Contents/MacOS/equipe-desktop" | grep -q "x86_64 arm64"
          lipo -archs "$mount/equipe.app/Contents/Helpers/equipe" | grep -q "x86_64 arm64"
          "$mount/equipe.app/Contents/Helpers/equipe" --version
          codesign --verify --deep --strict "$mount/equipe.app"
          if [ -n "$APPLE_API_KEY" ] && [ -n "$MACOS_CERTIFICATE" ]; then
            # Apple's ticket service drops a connection now and then: a few tries.
            for try in 1 2 3 4 5; do xcrun stapler validate "$mount/equipe.app" && break; [ "$try" = 5 ] && exit 1; sleep $((try * 15)); done
            spctl -a -vv -t exec "$mount/equipe.app"
            for try in 1 2 3 4 5; do xcrun stapler validate dist/equipe.dmg && break; [ "$try" = 5 ] && exit 1; sleep $((try * 15)); done
          fi
          test -L "$mount/Applications"
          hdiutil detach "$mount"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: equipe-desktop
          path: dist/*

  # The install script against the archive just built, on a clean machine.
  try-install:
    needs: [mode, build]
    if: needs.mode.outputs.fast != 'true'
    strategy:
      matrix:
        include:
          - os: macos-15
          - os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: install.sh
        shell: bash
        run: |
          EQUIPE_DOWNLOAD_BASE="file://$PWD/dist" sh install.sh
          ~/.local/bin/equipe --version
          ~/.local/bin/equipe roles
          # Again over the top, as an update would.
          EQUIPE_DOWNLOAD_BASE="file://$PWD/dist" EQUIPE_NO_MODIFY_PATH=1 sh install.sh

  # A fast release skips try-install and desktop; anything else they end in
  # (failed, cancelled) holds the release back.
  publish:
    needs: [mode, build, try-install, desktop]
    if: >-
      !cancelled() && startsWith(github.ref, 'refs/tags/') &&
      needs.build.result == 'success' &&
      (needs.try-install.result == 'success' || (needs.mode.outputs.fast == 'true' && needs.try-install.result == 'skipped')) &&
      (needs.desktop.result == 'success' || (needs.mode.outputs.fast == 'true' && needs.desktop.result == 'skipped'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      # Fast: the app as the newest release has it. Its appcast still names
      # that version and that release's DMG, so no app update is offered.
      - name: The previous release's app
        if: needs.mode.outputs.fast == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "${GITHUB_REPOSITORY}" -D dist \
            --pattern equipe.dmg --pattern equipe.dmg.sha256 --pattern appcast.xml
          ls -l dist/equipe.dmg dist/appcast.xml
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp install.sh paste-setup.sh dist/
          (cd dist && cat *.sha256 > SHA256SUMS)
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "equipe ${GITHUB_REF_NAME}" --generate-notes --verify-tag $prerelease

  # Run by hand: check the tap token can still push, without publishing.
  tap-access:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: The tap takes a push
        run: |
          if [ -z "$TAP_TOKEN" ]; then echo "::warning::HOMEBREW_TAP_TOKEN isn't set; releases won't update Homebrew"; exit 0; fi
          git clone -q "https://x-access-token:${TAP_TOKEN}@github.com/equipe-labs/homebrew-tap.git" tap
          cd tap
          git config user.name "equipe release"
          git config user.email "release@equipe.im"
          git commit -q --allow-empty -m "access check"
          git push --dry-run origin HEAD:refs/heads/access-check

  homebrew:
    needs: [mode, publish]
    if: >-
      !cancelled() && needs.publish.result == 'success' &&
      startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
    runs-on: ubuntu-24.04
    env:
      FAST: ${{ needs.mode.outputs.fast }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.TAP_TOKEN != ''
        with:
          path: dist
          merge-multiple: true
      - name: Update equipe-labs/homebrew-tap
        if: env.TAP_TOKEN != ''
        run: |
          version="${GITHUB_REF_NAME#v}"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          sum() { cut -d' ' -f1 "dist/equipe-$1.tar.gz.sha256"; }
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/equipe-labs/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cat > tap/Formula/equipe.rb <<EOF
          class Equipe < Formula
            desc "Full software squad of AI agents, on your own Claude Code and Codex plans"
            homepage "https://equipe.im"
            version "${version}"
            license "MIT"

            on_macos do
              on_arm do
                url "${url}/equipe-aarch64-apple-darwin.tar.gz"
                sha256 "$(sum aarch64-apple-darwin)"
              end
              on_intel do
                url "${url}/equipe-x86_64-apple-darwin.tar.gz"
                sha256 "$(sum x86_64-apple-darwin)"
              end
            end

            on_linux do
              on_arm do
                url "${url}/equipe-aarch64-unknown-linux-musl.tar.gz"
                sha256 "$(sum aarch64-unknown-linux-musl)"
              end
              on_intel do
                url "${url}/equipe-x86_64-unknown-linux-musl.tar.gz"
                sha256 "$(sum x86_64-unknown-linux-musl)"
              end
            end

            def install
              bin.install "equipe"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/equipe --version")
            end
          end
          EOF
          # The Mac app as a cask beside the formula: brew install --cask
          # equipe-labs/tap/equipe. It updates itself (Sparkle), so brew
          # leaves its updates to it.
          mkdir -p tap/Casks
          # Fast: the app didn't change, nor does its cask.
          if [ "$FAST" != "true" ]; then
          cat > tap/Casks/equipe.rb <<EOF
          cask "equipe" do
            version "${version}"
            sha256 "$(cut -d' ' -f1 dist/equipe.dmg.sha256)"

            url "${url}/equipe.dmg"
            name "equipe"
            desc "Desktop app for a squad of AI agents on your own Claude Code and Codex plans"
            homepage "https://equipe.im"

            auto_updates true
            depends_on macos: ">= :monterey"

            app "equipe.app"

            zap trash: [
              "~/Library/Caches/im.equipe.desktop",
              "~/Library/HTTPStorages/im.equipe.desktop",
              "~/Library/Preferences/im.equipe.desktop.plist",
              "~/Library/Saved Application State/im.equipe.desktop.savedState",
            ]
          end
          EOF
          sed -i 's/^          //' tap/Casks/equipe.rb
          fi
          cd tap
          git config user.name "equipe release"
          git config user.email "release@equipe.im"
          git add Formula/equipe.rb Casks/equipe.rb
          git commit -m "equipe ${version}"
          git push

  # Old caches out, so the repository stays under GitHub's 10 GB and the ones
  # releases need aren't evicted.
  prune-caches:
    needs: homebrew
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/prune-caches.sh
        env:
          GH_TOKEN: ${{ github.token }}
