name: Release

# Push a tag like v0.1.0 (matching the workspace version) to build equipe for
# macOS and Linux and publish a GitHub Release with the binaries, their
# checksums and install.sh, and the desktop app (equipe.dmg, with the appcast
# its updates come from). Run it by hand to build without publishing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match the workspace version ${version}"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: musl toolchain
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p equipe --target ${{ matrix.target }}

      - name: Smoke test
        run: target/${{ matrix.target }}/release/equipe --version

      - name: Package
        shell: bash
        run: |
          name="equipe-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/equipe" LICENSE README.md "dist/$name/"
          cd dist
          tar -czf "$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null; then sha256sum "$name.tar.gz"; else shasum -a 256 "$name.tar.gz"; fi > "$name.tar.gz.sha256"
          rm -rf "$name"

      - uses: actions/upload-artifact@v5
        with:
          name: equipe-${{ matrix.target }}
          path: dist/*

  # The desktop app: scripts/desktop-dmg.sh, signed and notarized when the
  # secrets are there (docs/DESKTOP.md "Shipping the app"), else ad hoc.
  desktop:
    name: desktop (equipe.dmg)
    runs-on: macos-14
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v5

      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match the workspace version ${version}"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop

      - name: Developer ID certificate
        if: env.MACOS_CERTIFICATE != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          # shellcheck disable=SC2046 # one keychain path per word
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      - name: Notary key
        if: env.APPLE_API_KEY != ''
        run: |
          echo "$APPLE_API_KEY" > "$RUNNER_TEMP/notary.p8"
          {
            echo "EQUIPE_NOTARY_KEY=$RUNNER_TEMP/notary.p8"
            echo "EQUIPE_NOTARY_KEY_ID=$APPLE_API_KEY_ID"
            echo "EQUIPE_NOTARY_ISSUER=$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"

      - name: Build equipe.dmg
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: scripts/desktop-dmg.sh

      - name: Check the DMG
        run: |
          hdiutil verify dist/equipe.dmg
          mount="$(hdiutil attach -nobrowse -readonly dist/equipe.dmg | tail -1 | cut -f3)"
          lipo -archs "$mount/equipe.app/Contents/MacOS/equipe-desktop" | grep -q "x86_64 arm64"
          codesign --verify --deep --strict "$mount/equipe.app"
          test -L "$mount/Applications"
          hdiutil detach "$mount"

      - uses: actions/upload-artifact@v5
        with:
          name: equipe-desktop
          path: dist/*

  # The install script against the archive just built, on a clean machine.
  try-install:
    needs: build
    strategy:
      matrix:
        include:
          - os: macos-14
          - os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: install.sh
        shell: bash
        run: |
          EQUIPE_DOWNLOAD_BASE="file://$PWD/dist" sh install.sh
          ~/.local/bin/equipe --version
          ~/.local/bin/equipe roles
          # Again over the top, as an update would.
          EQUIPE_DOWNLOAD_BASE="file://$PWD/dist" EQUIPE_NO_MODIFY_PATH=1 sh install.sh

  publish:
    needs: [build, try-install, desktop]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp install.sh paste-setup.sh dist/
          (cd dist && cat *.sha256 > SHA256SUMS)
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "equipe ${GITHUB_REF_NAME}" --generate-notes --verify-tag $prerelease

  # Run by hand: check the tap token can still push, without publishing.
  tap-access:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: The tap takes a push
        run: |
          if [ -z "$TAP_TOKEN" ]; then echo "::warning::HOMEBREW_TAP_TOKEN isn't set; releases won't update Homebrew"; exit 0; fi
          git clone -q "https://x-access-token:${TAP_TOKEN}@github.com/equipe-labs/homebrew-tap.git" tap
          cd tap
          git config user.name "equipe release"
          git config user.email "release@equipe.im"
          git commit -q --allow-empty -m "access check"
          git push --dry-run origin HEAD:refs/heads/access-check

  homebrew:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
    runs-on: ubuntu-24.04
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        if: env.TAP_TOKEN != ''
      - uses: actions/download-artifact@v5
        if: env.TAP_TOKEN != ''
        with:
          path: dist
          merge-multiple: true
      - name: Update equipe-labs/homebrew-tap
        if: env.TAP_TOKEN != ''
        run: |
          cat dist/*.tar.gz.sha256 > SHA256SUMS
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/equipe-labs/homebrew-tap.git" tap
          mkdir -p tap/Formula
          scripts/homebrew-formula.sh "${GITHUB_REF_NAME}" SHA256SUMS > tap/Formula/equipe.rb
          cd tap
          git config user.name "equipe release"
          git config user.email "release@equipe.im"
          git add Formula/equipe.rb
          git commit -m "equipe ${GITHUB_REF_NAME#v}"
          git push

  # The release as people get it, on clean machines of each kind: the site's
  # two install lines (install.sh from the latest release, and the tap), each
  # giving this version. A failure here fails the release run. Run by hand, it
  # checks the latest published release, with the formula as this branch
  # would write it.
  installed:
    name: installed (${{ matrix.name }})
    needs: homebrew
    if: >-
      !cancelled() && (needs.homebrew.result == 'success' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
          - name: macOS x86_64
            os: macos-15-intel
          - name: Linux x86_64
            os: ubuntu-24.04
          - name: Linux arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - uses: actions/checkout@v5

      - name: The release to check
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName -q .tagName)"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=${tag}" >> "$GITHUB_ENV"
          echo "Checking ${tag} on $(uname -sm)"

      - name: install.sh
        run: |
          curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.sh" | sh
          test "$(~/.local/bin/equipe --version)" = "equipe ${tag#v}"
          ~/.local/bin/equipe --help >/dev/null
          rm ~/.local/bin/equipe

      - name: Homebrew
        run: |
          if ! command -v brew >/dev/null; then
            if [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
              eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
            else
              NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
              eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
            fi
          fi
          brew --version
          brew tap equipe-labs/tap
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            gh release download "${tag}" --repo "${GITHUB_REPOSITORY}" -p SHA256SUMS -D "$RUNNER_TEMP"
            scripts/homebrew-formula.sh "${tag}" "$RUNNER_TEMP/SHA256SUMS" > "$(brew --repo equipe-labs/tap)/Formula/equipe.rb"
          fi
          brew audit --strict equipe-labs/tap/equipe
          brew install equipe-labs/tap/equipe
          brew test equipe-labs/tap/equipe
          equipe="$(brew --prefix)/bin/equipe"
          test "$("$equipe" --version)" = "equipe ${tag#v}"
          "$equipe" --help >/dev/null
          file "$equipe"
