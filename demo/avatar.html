<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- The org avatar: a label. Bone ground, the wordmark reduced to its first
     letter and its chrome-grey period. Render with demo/render-avatar.sh. -->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:512px; height:512px; }
  body {
    background:#EFEDE7;
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    position:relative; overflow:hidden;
  }
  /* the faintest studio fall-off, so the ground reads as paper, not a fill */
  .light { position:absolute; inset:0;
    background: radial-gradient(520px 460px at 32% 22%, rgba(255,255,255,0.55), transparent 65%),
                radial-gradient(620px 520px at 70% 110%, rgba(10,10,12,0.06), transparent 60%);
  }
  .mark { position:absolute; left:50%; top:50%; transform:translate(-50%, -57%);
    font-size:318px; font-weight:700; letter-spacing:-18px; line-height:1; color:#0A0A0C; white-space:nowrap; }
  .mark span { color:#8f9aa8; }
  .grain { position:absolute; inset:0; width:100%; height:100%; opacity:0.07; mix-blend-mode:multiply; pointer-events:none; }
</style>
</head>
<body>
  <div class="light"></div>
  <div class="mark">e<span>.</span></div>
  <svg class="grain">
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/></filter>
    <rect width="100%" height="100%" filter="url(#n)"/>
  </svg>
</body>
</html>
