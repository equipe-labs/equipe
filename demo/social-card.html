<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1200px; height:675px; }
  body {
    background:#0A0A0C;
    color:#E9E6DF;
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    position:relative; overflow:hidden;
  }
  /* studio light + vignette */
  .light { position:absolute; inset:0;
    background:
      radial-gradient(760px 620px at 82% 8%, rgba(180,190,205,0.16), transparent 60%),
      radial-gradient(900px 900px at 50% 120%, rgba(0,0,0,0.55), transparent 55%);
  }
  .frame { position:absolute; inset:28px; border:1px solid rgba(233,230,223,0.14); }
  .tick { position:absolute; width:10px; height:10px; border:1px solid rgba(233,230,223,0.30); }
  .tick.tl{ left:22px; top:22px; border-right:0; border-bottom:0;}
  .tick.tr{ right:22px; top:22px; border-left:0; border-bottom:0;}
  .tick.bl{ left:22px; bottom:22px; border-right:0; border-top:0;}
  .tick.br{ right:22px; bottom:22px; border-left:0; border-top:0;}

  .kick { position:absolute; top:52px; left:64px; right:64px;
    display:flex; justify-content:space-between;
    font-size:14px; letter-spacing:3.5px; color:#8A8C92; text-transform:uppercase; }

  .stage { position:absolute; left:64px; top:150px; }
  .word { font-size:150px; font-weight:700; letter-spacing:-6px; line-height:0.9; color:#EFEDE7; }
  .word .p { color:#8f9aa8; }
  .rule { width:96px; height:1px; background:rgba(233,230,223,0.35); margin:26px 0 22px; }
  .tag { font-size:27px; font-weight:300; letter-spacing:0.2px; color:#CFCcC4; max-width:520px; }

  .credits { margin-top:30px; font-size:13.5px; letter-spacing:2.6px; color:#7C7E85;
    text-transform:uppercase; line-height:2.15; }
  .credits b { color:#B9B6AE; font-weight:500; }

  /* chrome object, cropped off the right edge */
  .obj { position:absolute; right:-70px; top:50%; transform:translateY(-50%); width:560px; height:560px; }
  .foot { position:absolute; left:64px; right:64px; bottom:50px;
    display:flex; justify-content:space-between;
    font-size:13px; letter-spacing:3px; color:#75777D; text-transform:uppercase; }

  .grain { position:absolute; inset:0; opacity:0.11; mix-blend-mode:overlay; pointer-events:none; }
</style>
</head>
<body>
  <div class="light"></div>

  <!-- chrome sculpture -->
  <svg class="obj" viewBox="0 0 560 560">
    <defs>
      <radialGradient id="chrome" cx="36%" cy="28%" r="82%">
        <stop offset="0%"  stop-color="#F6F7F8"/>
        <stop offset="18%" stop-color="#D2D6DC"/>
        <stop offset="40%" stop-color="#8A909B"/>
        <stop offset="62%" stop-color="#3B4049"/>
        <stop offset="82%" stop-color="#181B21"/>
        <stop offset="100%" stop-color="#0B0D11"/>
      </radialGradient>
      <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="rgba(180,205,230,0.55)"/>
        <stop offset="45%" stop-color="rgba(180,205,230,0)"/>
        <stop offset="100%" stop-color="rgba(120,110,150,0.35)"/>
      </linearGradient>
      <filter id="soft"><feGaussianBlur stdDeviation="7"/></filter>
    </defs>
    <ellipse cx="285" cy="470" rx="185" ry="26" fill="#000" opacity="0.55" filter="url(#soft)"/>
    <path d="M280 66 C 402 60, 500 158, 486 288 C 476 402, 388 500, 262 490
             C 150 481, 60 388, 70 268 C 78 158, 162 72, 280 66 Z"
          fill="url(#chrome)" stroke="url(#rim)" stroke-width="1.5"/>
    <!-- specular highlights -->
    <ellipse cx="196" cy="182" rx="70" ry="46" fill="#ffffff" opacity="0.65" filter="url(#soft)"/>
    <ellipse cx="360" cy="150" rx="26" ry="14" fill="#ffffff" opacity="0.45" filter="url(#soft)"/>
    <path d="M120 360 C 200 430, 330 442, 430 372" stroke="#ffffff" stroke-width="10"
          fill="none" opacity="0.18" filter="url(#soft)"/>
  </svg>

  <div class="frame"></div>
  <span class="tick tl"></span><span class="tick tr"></span>
  <span class="tick bl"></span><span class="tick br"></span>

  <div class="kick">
    <span>equipe — AI software squad</span>
    <span>Ch.01 · Building in public</span>
  </div>

  <div class="stage">
    <div class="word">equipe<span class="p">.</span></div>
    <div class="rule"></div>
    <div class="tag">A squad of AI agents that build the real thing.</div>
    <div class="credits">
      <b>Orchestrator</b> — plans · splits · gates<br>
      <b>Board</b> — single source of truth<br>
      PO · Designer · Frontend · Backend · QA · DevOps
    </div>
  </div>

  <div class="foot">
    <span>MIT · ACP-first · your model or subscription</span>
    <span>2026</span>
  </div>

  <svg class="grain">
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/></filter>
    <rect width="100%" height="100%" filter="url(#n)"/>
  </svg>
</body>
</html>
