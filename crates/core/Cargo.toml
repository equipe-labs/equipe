[package]
name = "equipe-core"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
equipe-desktop-control = { path = "../desktop-control" }
equipe-protocol = { path = "../protocol" }
equipe-providers = { path = "../providers" }
reqwest = { version = "0.13.5", default-features = false }
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process"] }
whatlang = "0.18.0"
