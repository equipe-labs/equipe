[package]
name = "equipe-core"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
equipe-desktop-control = { path = "../desktop-control" }
equipe-protocol = { path = "../protocol" }
equipe-providers = { path = "../providers" }
base64 = "0.23.1"
# Members' pictures, sent to screens as thumbnails (`visuals`).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Diagrams in replies, drawn for screens that can't draw them (`visuals::diagram`):
# Mermaid to SVG, SVG to PNG with the Mac's fonts.
mermaid-rs-renderer = { version = "0.3", default-features = false }
resvg = { version = "0.46", default-features = false, features = ["text", "system-fonts"] }
# App Store sales reports come gzipped (`signal_sources`).
flate2 = "1"
fs2 = "0.4"
# `rustls`: telemetry's, signals' and Nemotron's (`nemotron`) HTTPS to PostHog / App Store Connect (the CLI brings the same build).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
# App Store Connect tokens are ES256 JWTs (`signal_sources`).
ring = "0.17"
rusqlite = { version = "0.37", features = ["bundled"] }
# Login autopilot (`autopilot`): an authenticator QR code read off the site's
# setup page on this machine, and the mailbox's IMAP over TLS (the same rustls
# build reqwest and the CLI use).
rqrr = "0.11"
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-platform-verifier = "0.7"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3.2"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process"] }
whatlang = "0.18.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

# Logins' passwords on Windows, in Credential Manager only (`vault`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Credentials"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Logins' passwords, in the Keychain only (`vault`).
security-framework = "3"
# Frames of a phone recording (`phone::frames`), read with AVFoundation: the same bindings and features the desktop uses.
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSError"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMTime"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "AVAsset", "AVAssetImageGenerator", "objc2-core-foundation", "objc2-core-graphics", "objc2-core-media"] }
