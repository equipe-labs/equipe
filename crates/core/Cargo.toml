[package]
name = "equipe-core"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
equipe-desktop-control = { path = "../desktop-control" }
equipe-protocol = { path = "../protocol" }
equipe-providers = { path = "../providers" }
base64 = "0.23.1"
# Members' pictures, sent to screens as thumbnails (`visuals`).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libc = "0.2.190"
# App Store sales reports come gzipped (`signal_sources`).
flate2 = "1"
# `rustls`: telemetry's and signals' HTTPS to PostHog / App Store Connect (the CLI brings the same build).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
# App Store Connect tokens are ES256 JWTs (`signal_sources`).
ring = "0.17"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3.2"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process"] }
whatlang = "0.18.0"

# Logins' passwords, in the Keychain only (`vault`).
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
