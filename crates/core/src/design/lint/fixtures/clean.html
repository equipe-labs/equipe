<!doctype html>
<html lang="en">
<head>
<link rel="stylesheet" href="../build/css/tokens.css">
<style>
  body { font-family: var(--font-sans); background: var(--color-bg); color: var(--color-text); margin: 0; }
  .page { padding: var(--space-8) var(--space-6); max-width: 72rem; }
  .row { display: flex; gap: 16px; }
  button { padding: 8px 16px; border-radius: var(--radius-control); }
  button:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 3px; }
  .panel { background: var(--color-surface); padding: var(--space-6); }
  @media (prefers-reduced-motion: no-preference) { .panel { transition: transform 150ms ease-out; } }
  table { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main class="page">
  <h1>Notifications</h1>
  <p>Choose what reaches you, and where.</p>
  <section class="panel">
    <h2>Email</h2>
    <label for="digest">Daily digest</label>
    <input id="digest" type="checkbox" name="digest">
    <div class="row">
      <button type="submit" data-primary>Save changes</button>
      <button type="button">Cancel</button>
    </div>
  </section>
  <section class="panel">
    <h2>Recent deliveries</h2>
    <table><tr><th>Sent</th><th>To</th></tr><tr><td>09:12</td><td>you@example.com</td></tr><tr><td>08:40</td><td>team@example.com</td></tr></table>
  </section>
  <form action="/settings/notifications" method="post"><button type="submit">Send a test</button></form>
  <img src="empty.svg" alt="" width="120" height="80">
</main>
</body>
</html>
