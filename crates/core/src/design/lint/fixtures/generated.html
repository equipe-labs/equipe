<!doctype html>
<html>
<head>
<style>
  body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #6366F1, #A855F7); }
  .hero { text-align: center; padding: 72px 20px; }
  .eyebrow { text-transform: uppercase; letter-spacing: 0.2em; font-size: 11px; color: #A5B4FC; }
  .card { border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.12); padding: 28px; background: white; }
  .stat { border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.12); }
  .plan { border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.12); }
  button:focus { outline: none; }
  .badge-dot { animation: pulse 2s infinite; }
  @keyframes pulse { 50% { opacity: .4 } }
  h1 span { background: linear-gradient(90deg, #6366F1, #EC4899); -webkit-background-clip: text; color: transparent; }
</style>
</head>
<body>
<section class="hero">
  <p class="eyebrow"><span class="badge-dot"></span> NEW DASHBOARD</p>
  <h1>Manage your team <span>effortlessly</span></h1>
  <p>Trusted by 10,000+ teams worldwide.</p>
  <button class="cta">🚀 Get started</button>
</section>
<section>
  <p class="eyebrow">FEATURES</p>
  <h2>Everything you need</h2>
  <div class="card"><div class="card"><h3>✨ Smart insights</h3><p>Lorem ipsum dolor sit amet.</p></div></div>
  <div class="card"><h3>⚡ Fast</h3><p>Built for 99.9% uptime guaranteed.</p></div>
</section>
<section class="testimonials">
  <p class="eyebrow">WHAT PEOPLE SAY</p>
  <h2>Our customers</h2>
  <blockquote>“It changed everything.” — Jane Doe, CEO at Acme</blockquote>
</section>
<form class="signup">
  <input type="email" placeholder="Your email">
  <button></button>
</form>
<img src="logo.png">
</body>
</html>
