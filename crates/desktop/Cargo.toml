[package]
name = "equipe-desktop"
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "equipe-desktop"
path = "src/main.rs"

[dependencies]
equipe-core = { path = "../core" }
equipe-providers = { path = "../providers" }
# gpui-kit pins the matching GPUI snapshot (gpui-pre) and re-exports it, so we
# depend on exactly one UI crate and upgrade it on our own schedule.
# Code blocks are highlighted with tree-sitter: the languages members write
# most, and no more, as each grammar adds to the build.
gpui-kit = { version = "=0.7.1", features = [
    "speech",
    "tree-sitter-bash",
    "tree-sitter-css",
    "tree-sitter-diff",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-javascript",
    "tree-sitter-markdown",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-sql",
    "tree-sitter-swift",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
# Images a reply points at on the web: GPUI fetches them through this client.
gpui-pre-reqwest-client = "=0.3.8"
# Math and diagrams in replies: drawn to SVG, which GPUI rasterizes (resvg) at 2x.
latex-rust = { version = "2.1", default-features = false, features = ["std"] }
mermaid-rs-renderer = { version = "0.3", default-features = false }
libc = "0.2"
# Drafts and recent attachments, kept on disk between launches.
serde = { version = "1.0.229", features = ["derive"] }
# Drafts and recent attachments on disk; a JSON reply pretty-printed.
serde_json = "1"
# The daemon link runs its own small runtime on a thread off the UI.
tokio = { version = "1.53.2", features = ["rt", "macros", "sync", "time", "net", "io-util", "process", "fs"] }

# Attached screenshots: decoded, shrunk and thumbnailed off the UI thread.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff"] }
base64 = "0.23.1"
# Pairing a phone: the code, drawn as a QR code (the one `equipe pair` prints).
qrcode = { version = "0.14.1", default-features = false }
# `equipe send-image` drops files in an inbox; the folder is watched, not polled.
# (Renamed: this crate has a module of its own called `notify`.)
fs-notify = { package = "notify", version = "8", default-features = false, features = ["macos_fsevent"] }
# Markdown parsed as the text view parses it (the version gpui-kit uses), so
# ticket numbers are linked in text alone and emphasis next to Korean closes.
markdown = "=1.0.0"
# The text the code-block highlighter parses (the version gpui-component uses).
ropey = "=2.0.0-beta.1"

[target.'cfg(target_os = "macos")'.dependencies]
# Notifications while the window is out of sight; a click comes back to us.
mac-notification-sys = "0.6.15"
# Talks to Sparkle (updates) in the packaged app — see src/update.rs.
objc2 = "0.6"
# Sparkle's "install now" block, kept until the person asks for it.
block2 = "0.6"
# Attachments: a video's frames (AVFoundation), a PDF's first page and page
# count (CoreGraphics) — read on this Mac, off the UI thread (src/media.rs).
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSArray", "NSValue", "NSError", "NSDictionary"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFURL", "CFString", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage", "CGPDFDocument", "CGPDFPage", "CGAffineTransform", "CGGeometry"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMTime", "CMTimeRange"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "AVAsset", "AVAssetImageGenerator", "AVAssetTrack", "AVMediaFormat", "objc2-core-foundation", "objc2-core-graphics", "objc2-core-media"] }

[features]
snapshot = ["gpui-kit/test-support"]

