[package]
name = "equipe"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
console = "0.16.6"
crossterm = { version = "0.29", features = ["event-stream", "bracketed-paste"] }
dialoguer = "0.12.0"
dirs = "7.0.0"
equipe-core = { path = "../core" }
equipe-protocol = { path = "../protocol" }
equipe-providers = { path = "../providers" }
futures-util = "0.3.34"
hpke = { version = "0.14.1", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha"] }
libc = "0.2.190"
qrcode = { version = "0.14.1", default-features = false }
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
sha2 = "0.11.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
terminal_size = "0.4.4"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "io-std", "io-util", "net", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
unicode-width = "0.2.2"
