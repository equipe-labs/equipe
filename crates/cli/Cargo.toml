[package]
name = "equipe"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
console = "0.16.6"
dialoguer = "0.12.0"
equipe-providers = { version = "0.0.1", path = "../providers" }
reqwest = { version = "0.13.5", default-features = false }
terminal_size = "0.4.4"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros"] }
