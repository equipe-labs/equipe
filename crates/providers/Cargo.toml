[package]
name = "equipe-providers"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
base64 = "0.23.1"
dirs = "7.0.0"
futures-util = "0.3.34"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls", "form", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
sha2 = "0.11.0"
# An edit's change, as a diff, when Claude Code doesn't send its own.
similar = "2"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "process"] }
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v4"] }
