[package]
name = "equipe-desktop-control"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "Members working the Mac's desktop apps: the helper that holds the permissions, and its tools"

[dependencies]
base64 = "0.23.1"
getrandom = "0.4"
equipe-protocol = { path = "../protocol" }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.53.2", features = ["net", "io-util", "time", "rt"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSRunningApplication", "NSWorkspace"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGImage"] }
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "SCShareableContent",
    "SCScreenshotManager",
    "SCStream",
] }

[target.'cfg(windows)'.dependencies]
# Windows Graphics Capture for pixels; UI Automation and SendInput for the
# focus-safe element/input backend. Keep these target-only so Unix builds do
# not pull in WinRT or Direct3D.
windows-capture = "1.5.0"
windows = { version = "0.62.2", features = [
    "Foundation",
    "Graphics_Capture",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["rt", "macros"] }
