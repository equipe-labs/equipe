[workspace]
resolver = "3"
members = ["crates/*"]
# Patched copies of two GPUI crates (see [patch.crates-io]), not ours to lint.
exclude = ["vendor"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.48.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"

# Fast inner loop: optimize deps once, keep our own crates cheap to rebuild.
[profile.dev.package."*"]
opt-level = 2

# Two GPUI crates, patched where they offer no way in (each change is marked
# `equipe:` in the source; take them again on a gpui-kit upgrade):
# - gpui-pre: Korean wraps at spaces, as CSS `word-break: keep-all` — it broke
#   words between any two syllables (`LineWrapper::is_word_char`).
# - gpui-pre: the content zoom (⌘+ / ⌘-) — `Window::set_content_zoom` scales
#   the drawing and maps the viewport, input and IME positions (`zoom.rs`).
# - gpui-base: a text view's link underline and the room between list items
#   are the style's to set (`TextViewStyle`).
[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
gpui-base = { path = "vendor/gpui-base" }
