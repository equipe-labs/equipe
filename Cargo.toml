[workspace]
resolver = "3"
members = ["crates/*"]
# Patched copies of two GPUI crates (see [patch.crates-io]), not ours to lint.
exclude = ["vendor"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.69.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"

# Fast inner loop: optimize deps once, keep our own crates cheap to rebuild.
[profile.dev.package."*"]
opt-level = 2

# Two GPUI crates, patched where they offer no way in (each change is marked
# `equipe:` in the source; take them again on a gpui-kit upgrade):
# - gpui-pre: Korean wraps at spaces, as CSS `word-break: keep-all` — it broke
#   words between any two syllables (`LineWrapper::is_word_char`).
# - gpui-pre: the content zoom (⌘+ / ⌘-) — `Window::set_content_zoom` scales
#   the drawing and maps the viewport, input and IME positions (`zoom.rs`).
# - gpui-pre: `EQUIPE_PERF=1|2|3` logs frame times (wall and main-thread CPU)
#   and what asked for each frame (`window.rs` `equipe_perf`; docs/PERF-2026-10.md).
# - gpui-pre: a cached view is drawn again when an entity it read while drawn
#   is notified between frames, not only itself (`Window::notified_entities`,
#   `view.rs`; the desktop's panes, docs/PERF-2026-10.md 6).
# - gpui-base: a text view's link underline and the room between list items
#   are the style's to set (`TextViewStyle`).
# - gpui-base: where the window's selection ends are drawn, for what floats
#   over it (`TextSelection::ends`, `is_selecting`; `views/quote.rs`).
# - gpui-base: `ElementExt::on_prepaint` reports the element's own bounds —
#   its canvas pinned to the top-left, not flowed under the element's
#   children (`element_ext.rs`; the ticket card's place, `views/ticket_card.rs`).
[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
gpui-base = { path = "vendor/gpui-base" }
